<!doctype html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="../css/adatbazis.css"
        />
        <title>Building nevű osztály létrehozása</title>
    </head>
    <body>
        <div id="adat-kontener">
            <h1>Building nevű osztály létrehozása</h1>
            <ol>
                <li>
                    Kattintsunk a jobb egérklikkel a
                    <span class="kiemel">Building_Konzol</span> projekten.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_010.png" />
                </div>
                <li>
                    Válasszuk az <span class="kiemel">Add</span> és
                    <span class="kiemel">Class...</span> lehetőségeket.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_011.png" />
                </div>
                <li>
                    Írjuk be az osztály nevét, majd adjuk hozzá a projekthez.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_012.png" />
                </div>
                <li>Látható a projekt struktúrájában is:</li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_013.png" />
                </div>
            </ol>
        </div>
    </body>
</html>
