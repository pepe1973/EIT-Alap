<!doctype html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="../css/adatbazis.css"
        />
        <title>Konzolos és winformos projektek összekötése</title>
    </head>
    <body>
        <div id="adat-kontener">
            <h1>Konzolos és winformos projektek összekötése</h1>
            <ol>
                <li>
                    Kattintsunk a jobb egérklikkel a
                    <span class="kiemel">Building_Winform</span> projekten.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_011.png" />
                </div>
                <li>
                    Válasszuk az <span class="kiemel">Add</span> és
                    <span class="kiemel">Project Reference...</span>
                    lehetőségeket.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_012.png" />
                </div>
                <li>
                    Jelöljük ki a négyzetet. Majd
                    <span class="kiemel">OK</span>.
                </li>
                <div class="kep-tarto">
                    <img src="./doksik/kepek/kep_013.png" />
                </div>
            </ol>
        </div>
    </body>
</html>
